name: Docker Compose — Smoke test

# FBL-A1-5 gate: `docker compose up --build` is the documented no-Kubernetes
# local path. This builds and runs it for real on every PR/push touching the
# compose file, the Dockerfiles, or the nginx proxy config, so drift becomes
# a CI failure instead of a broken laptop demo.

on:
  pull_request:
    paths:
      - "docker-compose.yml"
      - ".github/workflows/compose-smoke.yml"
      - "workdir/Dockerfile"
      - "workdir/ui/Dockerfile"
      - "workdir/ui/**"
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - ".github/workflows/compose-smoke.yml"
      - "workdir/Dockerfile"
      - "workdir/ui/Dockerfile"
      - "workdir/ui/**"
  schedule:
    - cron: "53 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    name: docker compose up --build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: docker compose up --build (README command, verbatim)
        run: docker compose up --build -d

      - name: Wait for the engine health endpoint
        run: |
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/v2/health || echo "000")
            if [ "$status" = "200" ]; then
              echo "engine healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::engine did not become healthy within 30s"
          docker compose logs ruptura
          exit 1

      - name: Assert demo mode reports workloads and failures
        run: |
          status=$(curl -s -X POST http://localhost:8080/api/v2/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"ruptura-local-dev"}')
          token=$(echo "$status" | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])")

          total=$(curl -s -H "Authorization: Bearer ${token}" http://localhost:8080/api/v2/fleet \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['total_hosts'])")
          failures=$(curl -s -H "Authorization: Bearer ${token}" http://localhost:8080/api/v2/failures \
            | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          echo "workloads=${total} failures=${failures}"
          if [ "${total}" -lt 12 ] || [ "${failures}" -lt 4 ]; then
            echo "::error::expected 12 demo workloads and at least 4 failures, got ${total} and ${failures}"
            docker compose logs ruptura
            exit 1
          fi

      - name: Assert dashboard is reachable
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/ || echo "000")
          echo "dashboard status: ${status}"
          if [ "${status}" != "200" ]; then
            echo "::error::dashboard did not return 200 (got ${status})"
            docker compose logs ruptura-ui
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: docker compose down -v || true
