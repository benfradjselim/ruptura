site_name: Ruptura
site_description: "Named failures for Kubernetes and OpenShift workloads"
site_url: https://benfradjselim.github.io/ruptura/
repo_url: https://github.com/benfradjselim/ruptura
copyright: "© 2026 Selim Benfradj — Apache 2.0"

theme:
  name: material
  logo: ruptura-icon.png
  favicon: ruptura-icon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mermaid2

nav:
  - Home: index.md
  - Installation: install.md
  - RupturaInstance: rupturainstance.md
  - Failure modes: failures.md
  - Alerting: alerting.md
  - API: reference/api.md
  - Community:
    - Roadmap: community/roadmap.md
    - Contributing: community/contributing.md
    - License: about/license.md
