site_name: Ruptura
site_description: "Named failures for Kubernetes and OpenShift workloads"
site_url: https://benfradjselim.github.io/ruptura/
repo_url: https://github.com/benfradjselim/ruptura
copyright: "© 2026 Selim Benfradj — Apache 2.0"

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Schibsted Grotesk
    code: Martian Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - assets/ruptura.css

plugins:
  - search
  - mermaid2

nav:
  - Home: index.md
  - Installation: install.md
  - Disconnected install: install-disconnected.md
  - RupturaInstance: rupturainstance.md
  - Failure modes: failures.md
  - Alerting: alerting.md
  - Console plugin: console-plugin.md
  - API: reference/api.md
  - Blog:
    - Predict an OOM kill before it happens: blog/predict-an-oom-before-it-happens.md
  - Community:
    - Roadmap: community/roadmap.md
    - Contributing: community/contributing.md
    - License: about/license.md
