{{- if and .Values.openshift.enabled .Values.ui.enabled -}}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "ruptura.fullname" . }}-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ruptura.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  to:
    kind: Service
    name: {{ include "ruptura.fullname" . }}-ui
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
