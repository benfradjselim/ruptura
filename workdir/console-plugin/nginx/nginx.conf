# Serves the plugin assets to the OpenShift console over the service serving
# certificate and proxies the read endpoints of the engine, adding the API key
# server-side. Everything writable lives under /tmp, so the container runs
# with a read-only root filesystem and any UID.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen 9443 ssl;
        listen [::]:9443 ssl;
        ssl_certificate /var/serving-cert/tls.crt;
        ssl_certificate_key /var/serving-cert/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        root /usr/share/nginx/html;

        # Only the read endpoints of the engine are reachable; the rest of the
        # API, including anything that changes the engine, is refused here.
        location = /api/v2/failures {
            include /tmp/ruptura/proxy.conf;
        }
        location = /api/v2/failures/series {
            include /tmp/ruptura/proxy.conf;
        }
        location = /api/v2/failures/closest {
            include /tmp/ruptura/proxy.conf;
        }
        location = /api/v2/callgraph {
            include /tmp/ruptura/proxy.conf;
        }
        location /api/ {
            return 403;
        }

        # Plugin assets. The console checks the manifest on each load, so the
        # files are never cached by the browser.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }
    }
}
