signals:
  - name: memory_saturation
    mode: saturation
    usage: 'sum by (namespace,pod) (container_memory_working_set_bytes{container!="",container!="POD"})'
    capacity: 'sum by (namespace,pod) (kube_pod_container_resource_limits{resource="memory"})'
    restarts: 'sum by (namespace,pod) (kube_pod_container_status_restarts_total)'
  - name: cpu_throttling
    mode: condition
    usage: 'sum by (namespace,pod) (rate(container_cpu_cfs_throttled_periods_total{container!=""}[5m])) / sum by (namespace,pod) (rate(container_cpu_cfs_periods_total{container!=""}[5m]))'

roles:
  - {name: memory.usage, level: pod, profile: minimal, target: pod, query: 'sum by (namespace,pod) (container_memory_working_set_bytes{container!="",container!="POD"})'}
  - {name: memory.limit, level: pod, profile: minimal, target: pod, query: 'sum by (namespace,pod) (kube_pod_container_resource_limits{resource="memory"})'}
  - {name: cpu.throttled, level: pod, profile: minimal, target: pod, query: 'sum by (namespace,pod) (rate(container_cpu_cfs_throttled_periods_total{container!=""}[5m])) / sum by (namespace,pod) (rate(container_cpu_cfs_periods_total{container!=""}[5m]))'}
  - {name: container.restarts, level: pod, profile: minimal, target: pod, query: 'sum by (namespace,pod) (kube_pod_container_status_restarts_total)'}
  - {name: container.waiting, level: pod, profile: minimal, target: pod, query: 'sum by (namespace,pod) (kube_pod_container_status_waiting)'}
  - {name: pod.ready, level: pod, profile: minimal, target: pod, query: 'sum by (namespace,pod) (kube_pod_status_ready{condition="true"})'}
  - {name: cpu.usage, level: pod, profile: standard, target: pod, query: 'sum by (namespace,pod) (rate(container_cpu_usage_seconds_total{container!="",container!="POD"}[5m]))'}
  - {name: cpu.limit, level: pod, profile: standard, target: pod, query: 'sum by (namespace,pod) (kube_pod_container_resource_limits{resource="cpu"})'}
  - {name: memory.request, level: pod, profile: standard, target: pod, query: 'sum by (namespace,pod) (kube_pod_container_resource_requests{resource="memory"})'}
  - {name: cpu.request, level: pod, profile: standard, target: pod, query: 'sum by (namespace,pod) (kube_pod_container_resource_requests{resource="cpu"})'}
  - {name: network.receive, level: pod, profile: standard, target: pod, query: 'sum by (namespace,pod) (rate(container_network_receive_bytes_total[5m]))'}
  - {name: network.transmit, level: pod, profile: standard, target: pod, query: 'sum by (namespace,pod) (rate(container_network_transmit_bytes_total[5m]))'}
  - {name: network.drops, level: pod, profile: standard, target: pod, query: 'sum by (namespace,pod) (rate(container_network_receive_packets_dropped_total[5m]))'}
  - {name: disk.usage, level: pod, profile: standard, target: pod, query: 'sum by (namespace,pod) (container_fs_usage_bytes{container!=""})'}
  - {name: disk.limit, level: pod, profile: standard, target: pod, query: 'sum by (namespace,pod) (kube_pod_container_resource_limits{resource="ephemeral_storage"})'}
  - {name: replicas.desired, level: workload, profile: minimal, target: deployment, query: 'sum by (namespace,deployment) (kube_deployment_spec_replicas)'}
  - {name: replicas.available, level: workload, profile: minimal, target: deployment, query: 'sum by (namespace,deployment) (kube_deployment_status_replicas_available)'}
  - {name: replicas.unavailable, level: workload, profile: minimal, target: deployment, query: 'sum by (namespace,deployment) (kube_deployment_status_replicas_unavailable)'}
  - {name: rollout.stalled, level: workload, profile: minimal, target: deployment, query: 'sum by (namespace,deployment) (kube_deployment_status_condition{condition="Progressing",status="false"})'}
  - {name: container.oom, level: pod, profile: minimal, target: pod, query: 'sum by (namespace,pod) (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"})'}
  - {name: replicas.unavailable.statefulset, level: workload, profile: minimal, target: statefulset, query: 'sum by (namespace,statefulset) (kube_statefulset_replicas - kube_statefulset_status_replicas_ready)'}
  - {name: replicas.unavailable.daemonset, level: workload, profile: minimal, target: daemonset, query: 'sum by (namespace,daemonset) (kube_daemonset_status_number_unavailable)'}

# Failure cards read as data by the engine. Each id matches a card in the
# repository failures/ catalog. Severities are proposals until measured.
cards:
  - id: hpa-maxed-out
    failureMode: hpa_maxed_out
    level: workload
    kind: detected
    target: [namespace, horizontalpodautoscaler]
    value: 'max by (namespace,horizontalpodautoscaler) (kube_horizontalpodautoscaler_status_current_replicas) >= bool max by (namespace,horizontalpodautoscaler) (kube_horizontalpodautoscaler_spec_max_replicas)'
    sampled: 'max by (namespace,horizontalpodautoscaler) (timestamp(kube_horizontalpodautoscaler_status_current_replicas))'
    raiseAfter: 10m
    clearAfter: 5m
    severity: warning
    profile: minimal
    action: Raise the autoscaler maximum, or add capacity before load grows further
  - id: pdb-blocks-drain
    failureMode: pdb_blocks_drain
    level: workload
    kind: detected
    target: [namespace, poddisruptionbudget]
    value: '(max by (namespace,poddisruptionbudget) (kube_poddisruptionbudget_status_pod_disruptions_allowed) == bool 0) * (max by (namespace,poddisruptionbudget) (kube_poddisruptionbudget_status_expected_pods) > bool 0)'
    sampled: 'max by (namespace,poddisruptionbudget) (timestamp(kube_poddisruptionbudget_status_pod_disruptions_allowed))'
    raiseAfter: 10m
    clearAfter: 2m
    severity: warning
    profile: minimal
    action: Add replicas or relax the disruption budget, or the next node drain and cluster update will block
  - id: job-failed
    failureMode: job_failed
    level: workload
    kind: detected
    target: [namespace, job_name]
    value: 'max by (namespace,job_name) (kube_job_failed{condition="true"})'
    sampled: 'max by (namespace,job_name) (timestamp(kube_job_failed{condition="true"}))'
    raiseAfter: 0s
    clearAfter: 0s
    severity: warning
    profile: minimal
    action: Read the logs of the failed pod, fix the cause and run the Job again
  - id: node-filesystem-filling
    failureMode: node_filesystem_filling
    level: node
    kind: predicted
    target: [instance, device]
    usage: 'max by (instance,device) (node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|iso9660|ramfs|nsfs"} - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|iso9660|ramfs|nsfs"})'
    capacity: 'max by (instance,device) (node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|iso9660|ramfs|nsfs"})'
    sampled: 'max by (instance,device) (timestamp(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|iso9660|ramfs|nsfs"}))'
    horizon: 6h
    severity: critical
    profile: standard
    unit: bytes
    action: Find what writes to this filesystem and clean it, or grow it, before the node reports disk pressure
  - id: node-memory-exhaustion
    failureMode: node_memory_exhaustion
    level: node
    kind: predicted
    target: [instance]
    usage: 'max by (instance) (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes)'
    capacity: 'max by (instance) (node_memory_MemTotal_bytes)'
    sampled: 'max by (instance) (timestamp(node_memory_MemAvailable_bytes))'
    horizon: 1h
    severity: critical
    profile: standard
    unit: bytes
    action: Find the pods that grow on this node and set their requests and limits, or add memory, before the kubelet evicts
  - id: node-condition
    level: node
    kind: detected
    target: [node, condition]
    value: 'max by (node,condition) (kube_node_status_condition{condition="Ready",status="false"} or kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure",status="true"})'
    sampled: 'max by (node,condition) (timestamp(kube_node_status_condition))'
    modeLabel: condition
    modes:
      Ready: node_not_ready
      MemoryPressure: node_memory_pressure
      DiskPressure: node_disk_pressure
      PIDPressure: node_pid_pressure
    raiseAfter: 2m
    clearAfter: 2m
    severity: critical
    profile: minimal
    action: Check the kubelet and the node resources; pods on this node are or will be evicted
  - id: resource-quota-exhausted
    failureMode: quota_exhaustion
    level: namespace
    kind: predicted
    target: [namespace, resourcequota, resource]
    usage: 'max by (namespace,resourcequota,resource) (kube_resourcequota{type="used"})'
    capacity: 'max by (namespace,resourcequota,resource) (kube_resourcequota{type="hard"})'
    sampled: 'max by (namespace,resourcequota,resource) (timestamp(kube_resourcequota{type="used"}))'
    horizon: 6h
    severity: warning
    profile: minimal
    unit: count
    action: Raise the quota or remove unused objects, or new objects in this namespace will be refused
