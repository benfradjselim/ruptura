signals:
  - name: memory_saturation
    mode: saturation
    usage: 'sum by (namespace,pod) (container_memory_working_set_bytes{container!="",container!="POD"})'
    capacity: 'sum by (namespace,pod) (kube_pod_container_resource_limits{resource="memory"})'
    restarts: 'sum by (namespace,pod) (kube_pod_container_status_restarts_total)'
  - name: cpu_throttling
    mode: condition
    usage: 'sum by (namespace,pod) (rate(container_cpu_cfs_throttled_periods_total{container!=""}[5m])) / sum by (namespace,pod) (rate(container_cpu_cfs_periods_total{container!=""}[5m]))'

roles:
  - {name: memory.usage, level: pod, profile: minimal, target: pod, query: 'sum by (namespace,pod) (container_memory_working_set_bytes{container!="",container!="POD"})'}
  - {name: memory.limit, level: pod, profile: minimal, target: pod, query: 'sum by (namespace,pod) (kube_pod_container_resource_limits{resource="memory"})'}
  - {name: cpu.throttled, level: pod, profile: minimal, target: pod, query: 'sum by (namespace,pod) (rate(container_cpu_cfs_throttled_periods_total{container!=""}[5m])) / sum by (namespace,pod) (rate(container_cpu_cfs_periods_total{container!=""}[5m]))'}
  - {name: container.restarts, level: pod, profile: minimal, target: pod, query: 'sum by (namespace,pod) (kube_pod_container_status_restarts_total)'}
  - {name: container.waiting, level: pod, profile: minimal, target: pod, query: 'sum by (namespace,pod) (kube_pod_container_status_waiting)'}
  - {name: pod.ready, level: pod, profile: minimal, target: pod, query: 'sum by (namespace,pod) (kube_pod_status_ready{condition="true"})'}
  - {name: cpu.usage, level: pod, profile: standard, target: pod, query: 'sum by (namespace,pod) (rate(container_cpu_usage_seconds_total{container!="",container!="POD"}[5m]))'}
  - {name: cpu.limit, level: pod, profile: standard, target: pod, query: 'sum by (namespace,pod) (kube_pod_container_resource_limits{resource="cpu"})'}
  - {name: memory.request, level: pod, profile: standard, target: pod, query: 'sum by (namespace,pod) (kube_pod_container_resource_requests{resource="memory"})'}
  - {name: cpu.request, level: pod, profile: standard, target: pod, query: 'sum by (namespace,pod) (kube_pod_container_resource_requests{resource="cpu"})'}
  - {name: network.receive, level: pod, profile: standard, target: pod, query: 'sum by (namespace,pod) (rate(container_network_receive_bytes_total[5m]))'}
  - {name: network.transmit, level: pod, profile: standard, target: pod, query: 'sum by (namespace,pod) (rate(container_network_transmit_bytes_total[5m]))'}
  - {name: network.drops, level: pod, profile: standard, target: pod, query: 'sum by (namespace,pod) (rate(container_network_receive_packets_dropped_total[5m]))'}
  - {name: disk.usage, level: pod, profile: standard, target: pod, query: 'sum by (namespace,pod) (container_fs_usage_bytes{container!=""})'}
  - {name: disk.limit, level: pod, profile: standard, target: pod, query: 'sum by (namespace,pod) (kube_pod_container_resource_limits{resource="ephemeral_storage"})'}
  - {name: replicas.desired, level: workload, profile: minimal, target: deployment, query: 'sum by (namespace,deployment) (kube_deployment_spec_replicas)'}
  - {name: replicas.available, level: workload, profile: minimal, target: deployment, query: 'sum by (namespace,deployment) (kube_deployment_status_replicas_available)'}
  - {name: replicas.unavailable, level: workload, profile: minimal, target: deployment, query: 'sum by (namespace,deployment) (kube_deployment_status_replicas_unavailable)'}
  - {name: rollout.stalled, level: workload, profile: minimal, target: deployment, query: 'sum by (namespace,deployment) (kube_deployment_status_condition{condition="Progressing",status="false"})'}
  - {name: container.oom, level: pod, profile: minimal, target: pod, query: 'sum by (namespace,pod) (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"})'}
  - {name: replicas.unavailable.statefulset, level: workload, profile: minimal, target: statefulset, query: 'sum by (namespace,statefulset) (kube_statefulset_replicas - kube_statefulset_status_replicas_ready)'}
  - {name: replicas.unavailable.daemonset, level: workload, profile: minimal, target: daemonset, query: 'sum by (namespace,daemonset) (kube_daemonset_status_number_unavailable)'}

# Failure cards read as data by the engine. Each id matches a card in the
# repository failures/ catalog. Severities are proposals until measured.
cards:
  - id: hpa-maxed-out
    failureMode: hpa_maxed_out
    level: workload
    kind: detected
    target: [namespace, horizontalpodautoscaler]
    value: 'max by (namespace,horizontalpodautoscaler) (kube_horizontalpodautoscaler_status_current_replicas) >= bool max by (namespace,horizontalpodautoscaler) (kube_horizontalpodautoscaler_spec_max_replicas)'
    sampled: 'max by (namespace,horizontalpodautoscaler) (timestamp(kube_horizontalpodautoscaler_status_current_replicas))'
    raiseAfter: 10m
    clearAfter: 5m
    severity: warning
    profile: minimal
    action: Raise the autoscaler maximum, or add capacity before load grows further
  - id: pdb-blocks-drain
    failureMode: pdb_blocks_drain
    level: workload
    kind: detected
    target: [namespace, poddisruptionbudget]
    value: '(max by (namespace,poddisruptionbudget) (kube_poddisruptionbudget_status_pod_disruptions_allowed) == bool 0) * (max by (namespace,poddisruptionbudget) (kube_poddisruptionbudget_status_expected_pods) > bool 0)'
    sampled: 'max by (namespace,poddisruptionbudget) (timestamp(kube_poddisruptionbudget_status_pod_disruptions_allowed))'
    raiseAfter: 10m
    clearAfter: 2m
    severity: warning
    profile: minimal
    action: Add replicas or relax the disruption budget, or the next node drain and cluster update will block
  - id: job-failed
    failureMode: job_failed
    level: workload
    kind: detected
    target: [namespace, job_name]
    value: 'max by (namespace,job_name) (kube_job_failed{condition="true"})'
    sampled: 'max by (namespace,job_name) (timestamp(kube_job_failed{condition="true"}))'
    raiseAfter: 0s
    clearAfter: 0s
    severity: warning
    profile: minimal
    action: Read the logs of the failed pod, fix the cause and run the Job again
  - id: node-filesystem-filling
    failureMode: node_filesystem_filling
    level: node
    kind: predicted
    target: [instance, device]
    usage: 'max by (instance,device) (node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|iso9660|ramfs|nsfs"} - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|iso9660|ramfs|nsfs"})'
    capacity: 'max by (instance,device) (node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|iso9660|ramfs|nsfs"})'
    sampled: 'max by (instance,device) (timestamp(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|iso9660|ramfs|nsfs"}))'
    horizon: 6h
    severity: critical
    profile: standard
    unit: bytes
    action: Find what writes to this filesystem and clean it, or grow it, before the node reports disk pressure
  - id: node-memory-exhaustion
    failureMode: node_memory_exhaustion
    level: node
    kind: predicted
    target: [instance]
    usage: 'max by (instance) (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes)'
    capacity: 'max by (instance) (node_memory_MemTotal_bytes)'
    sampled: 'max by (instance) (timestamp(node_memory_MemAvailable_bytes))'
    horizon: 1h
    severity: critical
    profile: standard
    unit: bytes
    action: Find the pods that grow on this node and set their requests and limits, or add memory, before the kubelet evicts
  - id: node-condition
    level: node
    kind: detected
    target: [node, condition]
    value: 'max by (node,condition) (kube_node_status_condition{condition="Ready",status="false"} or kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure",status="true"})'
    sampled: 'max by (node,condition) (timestamp(kube_node_status_condition))'
    modeLabel: condition
    modes:
      Ready: node_not_ready
      MemoryPressure: node_memory_pressure
      DiskPressure: node_disk_pressure
      PIDPressure: node_pid_pressure
    raiseAfter: 2m
    clearAfter: 2m
    severity: critical
    profile: minimal
    action: Check the kubelet and the node resources; pods on this node are or will be evicted
  - id: resource-quota-exhausted
    failureMode: quota_exhaustion
    level: namespace
    kind: predicted
    target: [namespace, resourcequota, resource]
    usage: 'max by (namespace,resourcequota,resource) (kube_resourcequota{type="used"})'
    capacity: 'max by (namespace,resourcequota,resource) (kube_resourcequota{type="hard"})'
    sampled: 'max by (namespace,resourcequota,resource) (timestamp(kube_resourcequota{type="used"}))'
    horizon: 6h
    severity: warning
    profile: minimal
    unit: count
    action: Raise the quota or remove unused objects, or new objects in this namespace will be refused
  - id: inode-exhaustion
    failureMode: inode_exhaustion
    level: node
    kind: predicted
    target: [instance, device]
    usage: 'max by (instance,device) (node_filesystem_files{fstype!~"tmpfs|overlay|squashfs|iso9660|ramfs|nsfs"} - node_filesystem_files_free{fstype!~"tmpfs|overlay|squashfs|iso9660|ramfs|nsfs"})'
    capacity: 'max by (instance,device) (node_filesystem_files{fstype!~"tmpfs|overlay|squashfs|iso9660|ramfs|nsfs"})'
    sampled: 'max by (instance,device) (timestamp(node_filesystem_files_free{fstype!~"tmpfs|overlay|squashfs|iso9660|ramfs|nsfs"}))'
    horizon: 6h
    severity: critical
    profile: standard
    unit: count
    action: Find what creates many small files on this filesystem and clean them, before writes fail with no space left
  - id: too-many-pods
    failureMode: too_many_pods
    level: node
    kind: predicted
    target: [node]
    usage: 'max by (node) (kubelet_running_pods)'
    capacity: 'max by (node) (kube_node_status_capacity{resource="pods"})'
    sampled: 'max by (node) (timestamp(kubelet_running_pods))'
    horizon: 6h
    severity: warning
    profile: minimal
    unit: count
    action: Spread the pods over more nodes or raise maxPods, before new pods on this node stay Pending
  - id: conntrack-table-full
    failureMode: conntrack_table_full
    level: node
    kind: predicted
    target: [instance]
    usage: 'max by (instance) (node_nf_conntrack_entries)'
    capacity: 'max by (instance) (node_nf_conntrack_entries_limit)'
    sampled: 'max by (instance) (timestamp(node_nf_conntrack_entries))'
    horizon: 1h
    severity: critical
    profile: standard
    unit: count
    action: Find the pods that open many short connections, or raise nf_conntrack_max, before the kernel drops new connections
  - id: node-capacity-cpu
    failureMode: node_capacity_exhausted
    level: node
    kind: predicted
    target: [node]
    usage: 'sum by (node) (kube_pod_container_resource_requests{resource="cpu",node!=""} * on (namespace,pod) group_left() (max by (namespace,pod) (kube_pod_status_phase{phase=~"Pending|Running"}) == 1))'
    capacity: 'max by (node) (kube_node_status_allocatable{resource="cpu"})'
    sampled: 'max by (node) (timestamp(kube_node_status_allocatable{resource="cpu"}))'
    horizon: 24h
    severity: warning
    profile: minimal
    unit: cores
    action: Add nodes or lower CPU requests, before new pods cannot be scheduled
  - id: node-capacity-memory
    failureMode: node_capacity_exhausted
    level: node
    kind: predicted
    target: [node]
    usage: 'sum by (node) (kube_pod_container_resource_requests{resource="memory",node!=""} * on (namespace,pod) group_left() (max by (namespace,pod) (kube_pod_status_phase{phase=~"Pending|Running"}) == 1))'
    capacity: 'max by (node) (kube_node_status_allocatable{resource="memory"})'
    sampled: 'max by (node) (timestamp(kube_node_status_allocatable{resource="memory"}))'
    horizon: 24h
    severity: warning
    profile: minimal
    unit: bytes
    action: Add nodes or lower memory requests, before new pods cannot be scheduled
  - id: clock-not-synchronised
    failureMode: clock_not_synchronised
    level: node
    kind: detected
    target: [instance]
    value: 'clamp_max(max by (instance) (abs(node_timex_offset_seconds) > bool 0.05) + max by (instance) ((node_timex_sync_status == bool 0) * (node_timex_maxerror_seconds >= bool 16)), 1)'
    sampled: 'max by (instance) (timestamp(node_timex_offset_seconds))'
    raiseAfter: 10m
    clearAfter: 5m
    severity: warning
    profile: standard
    evidence: Clock offset over 50 ms, or time sync lost, reported by node-exporter
    action: Check chronyd or NTP on this node; certificates, leases and etcd depend on a correct clock
  - id: node-readiness-flapping
    failureMode: node_readiness_flapping
    level: node
    kind: detected
    target: [node]
    value: 'sum by (node) (changes(kube_node_status_condition{condition="Ready",status="true"}[15m])) > bool 2'
    sampled: 'max by (node) (timestamp(kube_node_status_condition{condition="Ready",status="true"}))'
    raiseAfter: 15m
    clearAfter: 15m
    severity: warning
    profile: minimal
    evidence: Ready condition changed more than twice in 15 minutes, reported by kube-state-metrics
    action: Check the kubelet, container runtime and network of this node; its pods are being disrupted
  - id: tcp-retransmits
    failureMode: tcp_retransmits
    level: node
    kind: detected
    target: [instance]
    value: '(max by (instance) (rate(node_netstat_Tcp_RetransSegs[5m]) / rate(node_netstat_Tcp_OutSegs[5m])) > bool 0.01) * (max by (instance) (rate(node_netstat_Tcp_OutSegs[5m])) > bool 100)'
    sampled: 'max by (instance) (timestamp(node_netstat_Tcp_RetransSegs))'
    raiseAfter: 15m
    clearAfter: 5m
    severity: warning
    profile: standard
    evidence: Over 1% of TCP segments sent by this node are retransmissions, reported by node-exporter
    action: Check the node's interfaces for errors and drops, and the network path to its peers
  - id: webhook-failing
    failureMode: webhook_failing
    level: cluster
    kind: detected
    target: [name]
    value: 'clamp_max(((sum by (name) (rate(apiserver_admission_webhook_request_total{rejected="true",code!~"2..|4.."}[5m])) or sum by (name) (rate(apiserver_admission_webhook_request_total[5m])) * 0) > bool 0) + (histogram_quantile(0.99, sum by (name,le) (rate(apiserver_admission_webhook_admission_duration_seconds_bucket[5m]))) > bool 2), 1)'
    sampled: 'max by (name) (timestamp(apiserver_admission_webhook_admission_duration_seconds_count))'
    raiseAfter: 10m
    clearAfter: 5m
    severity: critical
    profile: minimal
    evidence: The API server reports calls to this admission webhook failing, or a 99th percentile over 2 s
    action: Check the pods and the Service behind this webhook; while it fails, object changes it covers are refused or slowed
  - id: apiserver-errors-latency
    failureMode: apiserver_errors_latency
    level: cluster
    kind: detected
    target: [apiserver]
    value: 'clamp_max((sum by (apiserver) (rate(apiserver_request_total{code=~"5.."}[5m])) / sum by (apiserver) (rate(apiserver_request_total[5m])) > bool 0.05) + (histogram_quantile(0.99, sum by (apiserver,le) (rate(apiserver_request_duration_seconds_bucket{verb!~"WATCH|CONNECT"}[5m]))) > bool 1), 1)'
    sampled: 'max by (apiserver) (timestamp(apiserver_request_total))'
    raiseAfter: 10m
    clearAfter: 5m
    severity: critical
    profile: minimal
    evidence: Over 5% of API requests return 5xx, or the 99th percentile of non-watch requests is over 1 s
    action: Check etcd latency and the API server logs, and look for a client flooding the API
  - id: etcd-database-quota
    failureMode: etcd_database_quota
    level: cluster
    kind: predicted
    target: [pod]
    usage: 'max by (pod) (etcd_mvcc_db_total_size_in_bytes)'
    capacity: 'max by (pod) (etcd_server_quota_backend_bytes)'
    sampled: 'max by (pod) (timestamp(etcd_mvcc_db_total_size_in_bytes))'
    horizon: 24h
    severity: critical
    profile: minimal
    unit: bytes
    action: Compact and defragment etcd, or find the objects that grow, before etcd turns read-only
  - id: etcd-slow-disk
    failureMode: etcd_slow_disk
    level: cluster
    kind: detected
    target: [pod]
    value: 'clamp_max((histogram_quantile(0.99, sum by (pod,le) (rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m]))) > bool 0.5) + (histogram_quantile(0.99, sum by (pod,le) (rate(etcd_disk_backend_commit_duration_seconds_bucket[5m]))) > bool 0.25), 1)'
    sampled: 'max by (pod) (timestamp(etcd_disk_wal_fsync_duration_seconds_count))'
    raiseAfter: 10m
    clearAfter: 5m
    severity: warning
    profile: minimal
    evidence: etcd WAL fsync 99th percentile over 0.5 s, or backend commit over 0.25 s
    action: Move etcd to faster disks or find what shares its disk; slow commits slow the whole cluster
  - id: etcd-member-down
    failureMode: etcd_member_down
    level: cluster
    kind: detected
    target: [pod]
    value: 'max by (pod) ((etcd_server_has_leader == bool 0) or (up{job="etcd"} == bool 0))'
    sampled: 'max by (pod) (timestamp(etcd_server_has_leader))'
    raiseAfter: 3m
    clearAfter: 2m
    severity: critical
    profile: minimal
    evidence: This etcd member has no leader, or its metrics target is down
    action: Restore this etcd member; one more loss can cost the cluster its quorum
  - id: cluster-operator-degraded
    failureMode: cluster_operator_degraded
    level: cluster
    kind: detected
    target: [name]
    value: 'max by (name) (cluster_operator_conditions{condition="Degraded"})'
    sampled: 'max by (name) (timestamp(cluster_operator_conditions{condition="Degraded"}))'
    raiseAfter: 30m
    clearAfter: 5m
    severity: warning
    profile: minimal
    evidence: The cluster version operator reports this ClusterOperator Degraded
    action: Read the conditions of this ClusterOperator (oc get co) and the logs of its operator
  - id: cluster-operator-down
    failureMode: cluster_operator_degraded
    level: cluster
    kind: detected
    target: [name]
    value: 'max by (name) (cluster_operator_conditions{condition="Available"} == bool 0)'
    sampled: 'max by (name) (timestamp(cluster_operator_conditions{condition="Available"}))'
    raiseAfter: 10m
    clearAfter: 5m
    severity: critical
    profile: minimal
    evidence: The cluster version operator reports this ClusterOperator not Available
    action: Read the conditions of this ClusterOperator (oc get co); the component it manages is not available
  - id: operator-install-failed
    failureMode: operator_install_failed
    level: cluster
    kind: detected
    target: [exported_namespace, name]
    value: 'max by (exported_namespace,name) (csv_succeeded == bool 0)'
    sampled: 'max by (exported_namespace,name) (timestamp(csv_succeeded))'
    raiseAfter: 10m
    clearAfter: 5m
    severity: warning
    profile: minimal
    evidence: OLM reports this ClusterServiceVersion not Succeeded
    action: Read the status of this ClusterServiceVersion and its InstallPlan, then fix or roll back the operator
  - id: monitoring-target-down
    failureMode: monitoring_target_down
    level: cluster
    kind: detected
    target: [namespace, job, instance]
    value: 'max by (namespace,job,instance) (up == bool 0)'
    sampled: 'max by (namespace,job,instance) (timestamp(up))'
    raiseAfter: 15m
    clearAfter: 5m
    severity: warning
    profile: minimal
    evidence: Prometheus cannot scrape this target
    action: Check the pod and the endpoint behind this target; while it is down its failures go unseen
  - id: dns-resolution-failures
    failureMode: dns_resolution_failures
    level: cluster
    kind: detected
    target: [namespace]
    value: '(sum by (namespace) (rate(coredns_dns_responses_total{rcode="SERVFAIL"}[5m])) / sum by (namespace) (rate(coredns_dns_responses_total[5m])) > bool 0.03) * (sum by (namespace) (rate(coredns_dns_responses_total[5m])) > bool 1)'
    sampled: 'max by (namespace) (timestamp(coredns_dns_responses_total))'
    raiseAfter: 10m
    clearAfter: 5m
    severity: warning
    profile: minimal
    evidence: Over 3% of DNS answers are SERVFAIL
    action: Check the CoreDNS pods and their upstream resolvers; lookups that fail break calls between services
  - id: liveness-probe-restarts
    failureMode: liveness_probe_restarts
    level: pod
    kind: detected
    target: [namespace, pod]
    value: '(sum by (namespace,pod) (increase(prober_probe_total{probe_type="Liveness",result="failed"}[10m])) > bool 0) * (sum by (namespace,pod) (increase(kube_pod_container_status_restarts_total[10m])) > bool 0)'
    sampled: 'max by (namespace,pod) (timestamp(kube_pod_container_status_restarts_total))'
    raiseAfter: 0s
    clearAfter: 10m
    severity: warning
    profile: minimal
    evidence: The kubelet reports failed liveness probes and the container restarted in the last 10 minutes
    action: Check what slows the probed endpoint (CPU throttling, a slow dependency) or relax the liveness probe; the kubelet keeps restarting the container
  - id: readiness-probe-failing
    failureMode: readiness_probe_failing
    level: pod
    kind: detected
    target: [namespace, pod]
    value: 'sum by (namespace,pod) (increase(prober_probe_total{probe_type="Readiness",result="failed"}[5m])) > bool 0'
    sampled: 'max by (namespace,pod) (timestamp(prober_probe_total{probe_type="Readiness"}))'
    raiseAfter: 5m
    clearAfter: 2m
    severity: warning
    profile: minimal
    evidence: The kubelet reports failed readiness probes for over 5 minutes
    action: Check the readiness endpoint and what it depends on; the pod receives no traffic while it fails
  - id: config-error-at-start
    failureMode: config_error_at_start
    level: pod
    kind: detected
    target: [namespace, pod]
    value: 'max by (namespace,pod) (kube_pod_container_status_waiting_reason{reason=~"CreateContainerConfigError|CreateContainerError"})'
    sampled: 'max by (namespace,pod) (timestamp(kube_pod_container_status_waiting_reason))'
    raiseAfter: 2m
    clearAfter: 0s
    severity: critical
    profile: minimal
    evidence: A container waits with CreateContainerConfigError or CreateContainerError
    action: Create the missing ConfigMap or Secret, or fix the key or the container command it names
  - id: init-container-failing
    failureMode: init_container_failing
    level: pod
    kind: detected
    target: [namespace, pod]
    value: 'max by (namespace,pod) (kube_pod_init_container_status_waiting_reason{reason=~"CrashLoopBackOff|CreateContainerConfigError|CreateContainerError|ErrImagePull|ImagePullBackOff"})'
    sampled: 'max by (namespace,pod) (timestamp(kube_pod_init_container_status_waiting_reason))'
    raiseAfter: 2m
    clearAfter: 0s
    severity: critical
    profile: minimal
    evidence: An init container waits in back-off or cannot be created
    action: Read the logs of the init container and fix what it waits for; the main containers never start
  - id: service-without-endpoints
    failureMode: service_without_endpoints
    level: workload
    kind: detected
    target: [namespace, service]
    value: '(max by (namespace,service) (label_replace(label_replace(kube_endpointslice_info, "service", "$1", "endpointslice", "(.+)"), "service", "$1", "endpointslice", "(.+)-[a-z0-9]{5}")) unless on (namespace,service) max by (namespace,service) (label_replace(label_replace(kube_endpointslice_endpoints{ready="true"}, "service", "$1", "endpointslice", "(.+)"), "service", "$1", "endpointslice", "(.+)-[a-z0-9]{5}"))) or max by (namespace,service) (label_replace(label_replace(kube_endpointslice_info, "service", "$1", "endpointslice", "(.+)"), "service", "$1", "endpointslice", "(.+)-[a-z0-9]{5}")) * 0'
    sampled: 'max by (namespace,service) (label_replace(label_replace(timestamp(kube_endpointslice_info), "service", "$1", "endpointslice", "(.+)"), "service", "$1", "endpointslice", "(.+)-[a-z0-9]{5}"))'
    raiseAfter: 5m
    clearAfter: 2m
    severity: warning
    profile: minimal
    evidence: This Service has endpoint slices but no ready endpoint
    action: Check that the selector of this Service matches ready pods; calls to it fail
  - id: route-without-backend
    failureMode: route_without_backend
    level: workload
    kind: detected
    target: [exported_namespace, route]
    value: 'max by (exported_namespace,route) (haproxy_backend_up == bool 0)'
    sampled: 'max by (exported_namespace,route) (timestamp(haproxy_backend_up))'
    raiseAfter: 2m
    clearAfter: 2m
    severity: critical
    profile: minimal
    evidence: The OpenShift router reports the backend of this Route down
    action: Check the Service and the pods behind this Route; the router answers 503
  - id: pvc-pending
    failureMode: pvc_pending
    level: workload
    kind: detected
    target: [namespace, persistentvolumeclaim]
    value: 'max by (namespace,persistentvolumeclaim) (kube_persistentvolumeclaim_status_phase{phase="Pending"}) * on (namespace,persistentvolumeclaim) group_left() (max by (namespace,persistentvolumeclaim) (kube_pod_spec_volumes_persistentvolumeclaims_info) > bool 0)'
    sampled: 'max by (namespace,persistentvolumeclaim) (timestamp(kube_persistentvolumeclaim_status_phase))'
    raiseAfter: 5m
    clearAfter: 2m
    severity: warning
    profile: minimal
    evidence: A claim used by a pod has been Pending for over 5 minutes
    action: Check the storage class and the provisioner; the pods that mount this claim cannot start
  - id: persistent-volume-filling
    failureMode: persistent_volume_filling
    level: workload
    kind: predicted
    target: [namespace, persistentvolumeclaim]
    usage: 'max by (namespace,persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes - kubelet_volume_stats_available_bytes)'
    capacity: 'max by (namespace,persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes)'
    sampled: 'max by (namespace,persistentvolumeclaim) (timestamp(kubelet_volume_stats_available_bytes))'
    horizon: 6h
    severity: critical
    profile: minimal
    unit: bytes
    action: Grow the volume or clean what the application writes, before writes fail
  - id: persistent-volume-errors
    failureMode: persistent_volume_errors
    level: cluster
    kind: detected
    target: [persistentvolume]
    value: 'max by (persistentvolume) (kube_persistentvolume_status_phase{phase="Failed"})'
    sampled: 'max by (persistentvolume) (timestamp(kube_persistentvolume_status_phase))'
    raiseAfter: 2m
    clearAfter: 2m
    severity: warning
    profile: minimal
    evidence: This PersistentVolume is in phase Failed
    action: Read the events of this PersistentVolume and check the storage backend
  - id: eviction-node-memory-pressure
    failureMode: pod_evicted
    level: pod
    kind: detected
    target: [namespace, pod]
    value: 'max by (namespace,pod) (kube_pod_status_reason{reason="Evicted"})'
    sampled: 'max by (namespace,pod) (timestamp(kube_pod_status_reason))'
    raiseAfter: 0s
    clearAfter: 0s
    severity: warning
    profile: minimal
    evidence: This pod was evicted by the kubelet
    action: Set memory requests close to real use, and read the node failure that caused the eviction
  - id: ephemeral-storage-eviction
    failureMode: ephemeral_storage_eviction
    level: pod
    kind: predicted
    target: [namespace, pod]
    usage: 'sum by (namespace,pod) (container_fs_usage_bytes{container!=""})'
    capacity: 'sum by (namespace,pod) (kube_pod_container_resource_limits{resource="ephemeral_storage"})'
    sampled: 'max by (namespace,pod) (timestamp(container_fs_usage_bytes))'
    horizon: 1h
    severity: critical
    profile: standard
    unit: bytes
    action: Find what the pod writes to its local disk and move it to a volume, or raise the ephemeral storage limit, before the kubelet evicts it
  - id: pod-stuck-terminating
    failureMode: pod_stuck_terminating
    level: pod
    kind: detected
    target: [namespace, pod]
    value: 'max by (namespace,pod) (time() - kube_pod_deletion_timestamp > bool 600)'
    sampled: 'max by (namespace,pod) (timestamp(kube_pod_deletion_timestamp))'
    raiseAfter: 0s
    clearAfter: 0s
    severity: warning
    profile: minimal
    evidence: This pod has been terminating for over 10 minutes
    action: Check the finalizers of the pod and the node it ran on; force deletion only once the node is known to be down
  - id: cronjob-not-running
    failureMode: cronjob_not_running
    level: workload
    kind: detected
    target: [namespace, cronjob]
    value: '(max by (namespace,cronjob) (time() - kube_cronjob_next_schedule_time > bool 300)) * on (namespace,cronjob) (max by (namespace,cronjob) (kube_cronjob_spec_suspend) == bool 0)'
    sampled: 'max by (namespace,cronjob) (timestamp(kube_cronjob_next_schedule_time))'
    raiseAfter: 0s
    clearAfter: 2m
    severity: warning
    profile: minimal
    evidence: The scheduled time of this CronJob passed over 5 minutes ago and it is not suspended
    action: Check the controller, the concurrency policy and the starting deadline of this CronJob; its scheduled run did not start
  - id: kubelet-client-certificate
    failureMode: certificate_expiry
    level: node
    kind: deadline
    target: [node]
    value: 'min by (node) (kubelet_certificate_manager_client_ttl_seconds)'
    sampled: 'max by (node) (timestamp(kubelet_certificate_manager_client_ttl_seconds))'
    horizon: 48h
    severity: critical
    profile: minimal
    action: Check why the kubelet did not renew its client certificate (pending CSRs, approver); once it expires the node goes NotReady
  - id: kubelet-server-certificate
    failureMode: certificate_expiry
    level: node
    kind: deadline
    target: [node]
    value: 'min by (node) (kubelet_certificate_manager_server_ttl_seconds)'
    sampled: 'max by (node) (timestamp(kubelet_certificate_manager_server_ttl_seconds))'
    horizon: 48h
    severity: critical
    profile: minimal
    action: Check why the kubelet serving certificate was not renewed (pending CSRs); once it expires logs, exec and metrics of this node fail
  - id: kubelet-certificate-renewal-errors
    failureMode: certificate_expiry
    level: node
    kind: detected
    target: [node]
    value: 'max by (node) (increase(kubelet_certificate_manager_client_expiration_renew_errors[15m])) > bool 0'
    sampled: 'max by (node) (timestamp(kubelet_certificate_manager_client_expiration_renew_errors))'
    raiseAfter: 0s
    clearAfter: 15m
    severity: warning
    profile: minimal
    evidence: The kubelet failed to renew its client certificate in the last 15 minutes
    action: Look for pending CertificateSigningRequests of this node and approve or fix the approver, before the certificate expires
  - id: machine-config-pool-degraded
    failureMode: machine_config_pool_degraded
    level: cluster
    kind: detected
    target: [name]
    source: machineconfigpools
    raiseAfter: 5m
    clearAfter: 5m
    severity: warning
    profile: minimal
    evidence: This MachineConfigPool reports Degraded or counts a degraded machine, read from the Kubernetes API
    action: Read the pool conditions (oc describe mcp) and the machine-config-daemon logs of the degraded node; updates of this pool are blocked
  - id: dependency-call-failures
    failureMode: dependency_call_failures
    level: workload
    kind: detected
    target: [edge]
    source: callgraph
    above: 0.05
    raiseAfter: 5m
    clearAfter: 5m
    severity: warning
    profile: minimal
    evidence: Over 5% of the calls from this workload to its dependency fail, measured from traces
    action: Check the called workload and the network path between them; the caller's requests fail with it
  - id: log-exception-burst
    failureMode: log_exception_burst
    level: workload
    kind: detected
    target: [workload]
    source: logs
    above: 5
    raiseAfter: 0s
    clearAfter: 10m
    severity: warning
    profile: minimal
    evidence: This workload logs errors at over 5 times its usual rate (at least 10 a minute), from OTLP logs
    action: Read the new error messages of this workload; a burst usually comes just before or with a failure
  - id: error-budget-burn
    failureMode: error_budget_burn
    level: workload
    kind: detected
    target: [workload]
    source: slo
    above: 14.4
    raiseAfter: 5m
    clearAfter: 10m
    severity: critical
    profile: minimal
    evidence: This workload spends its error budget over 14 times faster than its objective allows, from failed calls measured in traces
    action: Find what fails in this workload's answers; at this rate a 30-day error budget is gone in about 2 days
  - id: network-policy-drops-cilium
    failureMode: network_policy_blocks_traffic
    level: node
    kind: detected
    target: [instance]
    value: 'max by (instance) (rate(cilium_drop_count_total{reason="Policy denied"}[5m])) > bool 0'
    sampled: 'max by (instance) (timestamp(cilium_drop_count_total{reason="Policy denied"}))'
    raiseAfter: 10m
    clearAfter: 5m
    severity: warning
    profile: minimal
    evidence: Cilium drops packets on this node because a network policy denies them
    action: Check the network policies changed recently and the traffic they now deny; allow it if the calls are wanted
  - id: network-policy-drops-calico
    failureMode: network_policy_blocks_traffic
    level: cluster
    kind: detected
    target: [policy]
    value: 'max by (policy) (rate(calico_denied_packets[5m])) > bool 0'
    sampled: 'max by (policy) (timestamp(calico_denied_packets))'
    raiseAfter: 10m
    clearAfter: 5m
    severity: warning
    profile: minimal
    evidence: Calico denies packets under this policy
    action: Check whether this policy changed recently and the traffic it now denies; allow it if the calls are wanted
  - id: pid-exhaustion-node
    failureMode: pid_exhaustion
    level: node
    kind: predicted
    target: [node]
    source: agent-node-pids
    horizon: 1h
    severity: critical
    profile: deep
    unit: count
    action: Find the pods that start many processes or threads on this node and set a PID limit, before new processes cannot start
  - id: pid-exhaustion-pod
    failureMode: pid_exhaustion
    level: pod
    kind: predicted
    target: [namespace, pod]
    source: agent-pod-pids
    horizon: 1h
    severity: critical
    profile: deep
    unit: count
    action: Find the thread or process leak in this pod, or raise its PID limit, before it cannot start new threads
  - id: network-policy-drops-ovn
    failureMode: network_policy_blocks_traffic
    level: namespace
    kind: detected
    target: [namespace]
    source: agent-policy-drops
    raiseAfter: 10m
    clearAfter: 5m
    severity: warning
    profile: deep
    evidence: OVN-Kubernetes logs packets dropped by a network policy of this namespace (ACL audit logging on)
    action: Check the network policies changed recently and the traffic they now deny; allow it if the calls are wanted
