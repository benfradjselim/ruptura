# Serves the web console and proxies /api/ to the engine. The server block is
# /etc/nginx/conf.d/default.conf when one is mounted, as the Helm chart does,
# or the one the entrypoint renders under /tmp. Everything writable lives under
# /tmp, so the container runs with any UID.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
    include /tmp/nginx/conf.d/*.conf;
}
