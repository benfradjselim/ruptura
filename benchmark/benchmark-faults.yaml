# periodic-spike: a sudden jump past the limit every 45 min, like a scheduled job.
# No trend for predict_linear, no crash loop, only the failure memory can warn.
# Added 2026-11-03 for the Nov 9 checkpoint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: periodic-spike
  namespace: demo-shop
spec:
  replicas: 1
  selector: {matchLabels: {app: periodic-spike}}
  template:
    metadata: {labels: {app: periodic-spike}}
    spec:
      containers:
        - name: app
          image: registry.access.redhat.com/ubi9/python-312
          command: ["python3", "-c"]
          args:
            - |
              import time
              time.sleep(2700)
              spike = b"\x01" * (300 << 20)
              time.sleep(60)
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
---
# leak-orders: steady leak of 2 MiB every 15 s, OOM about every 32 min.
# Deployed by hand on Nov 1, added to this file by the 2026-11-14 amendment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: leak-orders
  namespace: demo-shop
spec:
  replicas: 1
  selector: {matchLabels: {app: leak-orders}}
  template:
    metadata: {labels: {app: leak-orders}}
    spec:
      containers:
        - name: leak
          image: registry.access.redhat.com/ubi9/python-312
          command: ["python3", "-c"]
          args:
            - |
              import time
              held = []
              while True:
                  held.append(b"\x01" * (2 << 20))
                  time.sleep(15)
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 256Mi}
