      containers:
        - name: app
          image: registry.access.redhat.com/ubi9/does-not-exist:1
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-mount
  namespace: demo-shop
spec:
  replicas: 1
  selector: {matchLabels: {app: missing-mount}}
  template:
    metadata: {labels: {app: missing-mount}}
    spec:
      containers:
        - name: app
          image: registry.access.redhat.com/ubi9/ubi-minimal
          command: ["sleep", "infinity"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}
          volumeMounts: [{name: s, mountPath: /s}]
      volumes:
        - name: s
          secret: {secretName: does-not-exist}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-spike
  namespace: demo-shop
spec:
  replicas: 1
  selector: {matchLabels: {app: oom-spike}}
  template:
    metadata: {labels: {app: oom-spike}}
    spec:
      containers:
        - name: app
          image: registry.access.redhat.com/ubi9/python-312
          command: ["python3", "-c"]
          args:
            - |
              import time
              time.sleep(600)
              spike = b"\x01" * (300 << 20)
              time.sleep(60)
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
---
