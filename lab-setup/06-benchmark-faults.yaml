# Benchmark faults. step-leak fails by irregular jumps, sawtooth-batch is healthy
# and must stay silent. Both write to a memory backed volume to raise usage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: step-leak
  namespace: demo-shop
spec:
  replicas: 1
  selector: {matchLabels: {app: step-leak}}
  template:
    metadata: {labels: {app: step-leak}}
    spec:
      containers:
        - name: app
          image: registry.access.redhat.com/ubi9/ubi-minimal
          command: ["/bin/sh", "-c"]
          args:
            - |
              rm -f /m/*; i=0
              while true; do
                i=$((i+1))
                dd if=/dev/zero of=/m/block$i bs=1M count=48 2>/dev/null
                sleep $((180 + (i % 3) * 180))
              done
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 256Mi}
          volumeMounts: [{name: m, mountPath: /m}]
      volumes: [{name: m, emptyDir: {medium: Memory}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sawtooth-batch
  namespace: demo-shop
spec:
  replicas: 1
  selector: {matchLabels: {app: sawtooth-batch}}
  template:
    metadata: {labels: {app: sawtooth-batch}}
    spec:
      containers:
        - name: app
          image: registry.access.redhat.com/ubi9/ubi-minimal
          command: ["/bin/sh", "-c"]
          args:
            - |
              rm -f /m/*
              while true; do
                for i in 1 2 3 4 5 6 7 8; do
                  dd if=/dev/zero of=/m/block$i bs=1M count=24 2>/dev/null
                  sleep 75
                done
                rm -f /m/block*
                sleep 120
              done
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 256Mi}
          volumeMounts: [{name: m, mountPath: /m}]
      volumes: [{name: m, emptyDir: {medium: Memory}}]
